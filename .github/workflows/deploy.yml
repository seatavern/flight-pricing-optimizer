name: Test, build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flight-pricing-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: ca24794f8624acr
      ACR_SERVER: ca24794f8624acr.azurecr.io
      RESOURCE_GROUP: rg-energy-optimizer
      CONTAINER_APP: flight-pricing-optimizer
      APP_URL: https://flight-pricing-optimizer.thankfulsand-6fed6a90.germanywestcentral.azurecontainerapps.io
      IMAGE: ca24794f8624acr.azurecr.io/flight-pricing-optimizer:${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r backend/requirements.txt
      - name: Check frontend
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Test Python backend
        working-directory: backend
        run: python -m pytest
      - name: Build production Docker image
        run: docker build --build-arg NEXT_PUBLIC_API_BASE_URL=/ --tag "$IMAGE" .
      - name: Smoke-test both services in the image
        run: |
          docker run --detach --name flight-smoke --publish 127.0.0.1:3000:3000 "$IMAGE"
          python scripts/smoke_test.py http://127.0.0.1:3000 --timeout 900
      - name: Show container logs on failure
        if: failure()
        run: docker logs flight-smoke 2>/dev/null || true
      - name: Remove smoke-test container
        if: always()
        run: docker rm --force flight-smoke 2>/dev/null || true
      - name: Sign in to Azure using OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: a4db4d03-b675-481f-a206-387eb301eadc
          tenant-id: 3db27ecc-1791-4dda-9b51-798adfa4a3ca
          subscription-id: a4829d72-3f4a-4b3e-ab5a-b4bbb8156fa9
      - name: Push tested image to the existing registry
        run: |
          az acr login --name "$ACR_NAME"
          docker push "$IMAGE"
      - name: Update existing app and verify deployment
        run: python scripts/deploy.py
      - name: Sign out of the registry
        if: always()
        run: docker logout "$ACR_SERVER" || true
